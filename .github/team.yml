# Who owns which part of TrafficMAS+.
#
# This file is the single source of truth for code ownership:
#   - scripts/check_ownership.py reads it in CI and fails a pull request or a push to a
#     part branch that changes files outside the parts its author may edit;
#   - `python scripts/check_ownership.py --write-codeowners` regenerates .github/CODEOWNERS
#     from it (fill in the `github` usernames first).
#
# A file belongs to the part with the longest matching path. Files that match no part are
# shared (contracts, packaging, CI, end-to-end tests, README): only the maintainer changes them.

maintainer: part2

parts:
  part1:
    member: IANCOVICI Teodor-Gabriel
    role: Simulation Core & Network Architect
    branch: part1-iancovici
    github: IancoviciTeodor
