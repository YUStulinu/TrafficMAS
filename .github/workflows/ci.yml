name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint
        run: ruff check trafficmas tests scripts
      - name: Test
        run: python -m pytest -q
      - name: Short experiment and headless live view
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          python -m trafficmas run scenarios/grid_rush_hour.yaml -c negotiation_coord -s demand.duration=600
          python -m trafficmas experiment experiments/braess.yaml --seeds 2
          python -m trafficmas run scenarios/grid_emergency.yaml --record ci_demo.gif --record-seconds 20
          test -s results/braess/summary.md && test -s ci_demo.gif
