[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trafficmas"
version = "1.0.0"
description = "Multi-agent traffic simulation: traffic lights that negotiate green time and emergency corridors"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["simpy>=4.1", "networkx>=3.2", "numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "pyyaml>=6", "pygame-ce>=2.4", "pillow>=10"]

[project.optional-dependencies]
osm = ["osmnx>=2.0"]
dev = ["pytest", "ruff"]

[project.scripts]
trafficmas = "trafficmas.cli:main"

[tool.setuptools.packages.find]
include = ["trafficmas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
